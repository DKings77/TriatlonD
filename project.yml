# ------------------------------------------------------------------
# project.yml — Definición del proyecto para XcodeGen
# Misma mecánica que MotoTestA2: GitHub Actions ejecuta
# "xcodegen generate" en un Mac y compila el .ipa sin firmar.
# ------------------------------------------------------------------
name: TriatlonD

options:
  bundleIdPrefix: com.davidreyes
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  TriatlonD:
    type: application
    platform: iOS
    sources:
      - path: TriatlonD
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davidreyes.triatlond
        MARKETING_VERSION: "0.13"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Triatlon D"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
